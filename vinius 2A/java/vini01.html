<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Notas</title>
    <link rel="stylesheet" href="vini01.css">
</head>
<body>
    <div class="container">
        <h2>Sistema de Avaliação</h2>
        <div class="nota-box">
            <label for="nota">Digite a nota (0 a 10):</label>
            <input type="number" id="nota" step="0.1" min="0" max="10" placeholder="Ex: 7.5">
            <button id="verificarBtn">Verificar Situação</button>
            <div id="resultado" class="resultado"></div>
        </div>
    </div>
    <script src="vini01.js"></script>
</body>
</html>
