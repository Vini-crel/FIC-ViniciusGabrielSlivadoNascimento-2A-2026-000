 <!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordenar Ordens - Ordenador de Números</title>
    <link rel="stylesheet" href="vini01.css">
</head>
<body>
    <div class="container">
        <h1>📊 Ordenar Ordens</h1>
        <p>Digite os números separados por vírgula (ex: 5, 2, 9, 1, 7)</p>
        
        <div class="input-group">
            <textarea id="valores" placeholder="Exemplo: 10, 3, 8, 2, 5" rows="3"></textarea>
        </div>
        
        <div class="botoes">
            <button id="btnCrescente">📈 Ordenar Crescente</button>
            <button id="btnDecrescente">📉 Ordenar Decrescente</button>
            <button id="btnLimpar">🗑️ Limpar</button>
        </div>
        
        <div class="resultado-area">
            <h3>Resultado ordenado:</h3>
            <div id="resultado" class="resultado-box">---</div>
        </div>
        
        <div id="erro" class="erro-msg"></div>
    </div>
    
    <script src="vini01.js"></script>
</body>
</html>
